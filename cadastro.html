<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Mãos Abertas - Cadastro de Voluntário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <h1>ONG Mãos Abertas</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Novo Voluntário</h2>
            <p>Preencha os dados abaixo para se juntar à nossa rede de aopio.</p>

            <form action="#" method="post">

                <!-- Agrupamento 1: Dados Pessoais -->
                 <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.d{3}.\d{3}-\d{2}" placeholder="000.000.000-00">
                    <br><br>

                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                 </fieldset>

                 <br>

                 <!-- Agrupamento 2: Contato e Endereço -->
                  <fieldset>
                    <legend>Contato e Endereço</legend>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    <br><br>

                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(11)99999-9999">
                    <br><br>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000">
                  </fieldset>

                  <br>
                  <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Mãos Abertas. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
